[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-intelligence"
version = "0.1.0"
description = "CORTEX Phase D1 Enterprise Data Ingestion & Neo4j Knowledge Graph Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "neo4j>=5.25.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "pypdf>=7.0.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "scipy>=1.11.0",
  "scikit-learn>=1.3.0",
  "lightgbm>=4.1.0",
  "xgboost>=2.0.0",
  "joblib>=1.3.0",
  "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

